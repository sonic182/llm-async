version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"

    open-pull-requests-limit: 5

    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
